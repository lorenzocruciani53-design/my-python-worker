name: Cacciatore affari Ready2Game

on:
  # Sempre acceso: ogni turno cerca in continuo per ~50 minuti e alla fine fa partire il turno
  # successivo da solo. Il cron orario è solo una riserva se la catena si interrompe.
  # Per spegnere: in cacciatore/config.json metti "sempre_acceso": false.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write     # per far ripartire il turno successivo
  models: read       # AI gratuita di GitHub (GitHub Models)

concurrency:
  group: cacciatore-affari
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOTS: ${{ secrets.TELEGRAM_BOTS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Controllo segreti
        id: check
        run: |
          if [ -z "$TELEGRAM_BOTS" ] && { [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; }; then
            echo "Manca il segreto TELEGRAM_BOTS (o TELEGRAM_TOKEN + TELEGRAM_CHAT_ID): giro saltato."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cacciatore/requirements.txt

      # memoria tra un giro e l'altro: annunci già visti, storico prezzi, listino
      - name: Ripristina memoria
        if: steps.check.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            cacciatore/data/affari.sqlite
            cacciatore/data/listino.json
          key: memoria-${{ github.run_id }}
          restore-keys: memoria-

      - name: Installa
        if: steps.check.outputs.ok == 'true'
        run: |
          pip install -r cacciatore/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Giro di ricerca
        if: steps.check.outputs.ok == 'true'
        run: timeout 56m python -m cacciatore --durata-minuti 52 || true

      - name: Salva memoria
        if: always() && steps.check.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            cacciatore/data/affari.sqlite
            cacciatore/data/listino.json
          key: memoria-${{ github.run_id }}

      - name: Pubblica dashboard (scaricabile dalla pagina del giro)
        if: always() && steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: cacciatore/data/dashboard.html
          retention-days: 3
          if-no-files-found: ignore

      - name: Fai partire il turno successivo (sempre acceso)
        if: always() && steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('cacciatore/config.json')).get('sempre_acceso', True) else 1)"; then
            gh workflow run cacciatore-affari.yml --ref "${{ github.ref_name }}" && echo "Turno successivo avviato."
          else
            echo "sempre_acceso = false: non riparto."
          fi
